; EvoKNX Box firmware. Build and upload with PlatformIO (VS Code extension or `pio run -t upload`).
; Needs Arduino-ESP32 core 3.x (the pioarduino platform below). Fill in the pins in src/board.h first.
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; ESP32-S3-WROOM-1U N16R8: 16 MB flash, 8 MB PSRAM (octal). If the board does not start, try qio_qspi.
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
lib_deps = bblanchon/ArduinoJson@^7.2.1
build_flags = -DCORE_DEBUG_LEVEL=1
