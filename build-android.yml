name: Build EVOKNX App (Android)

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/evoknx_app/**'
      - 'packages/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  # Mỗi lần commit: chỉ kiểm tra lỗi code App (nhanh, không tạo file).
  app-check:
    name: Kiểm tra code App
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evoknx_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Phân tích code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

  # Chỉ build APK khi bấm "Run workflow" trong tab Actions.
  android:
    name: Build APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/evoknx_app
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tạo dự án Android (mã ứng dụng vn.evohome.evoknx)
        run: |
          flutter create --platforms=android --org vn.evohome --project-name evoknx --no-pub .
          # Giữ nguyên các file của App trong repo (flutter create chỉ thêm thư mục android)
          git checkout -- pubspec.yaml lib analysis_options.yaml test

      - name: Quyền truy cập mạng, tên App, biểu tượng
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
          )
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', perms + '    <application', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="EVOKNX"', s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          # url_launcher: open web links
          if '<queries>' not in s:
              s = s.replace('</manifest>', '    <queries>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="http"/></intent>\n    </queries>\n</manifest>')
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cp -r android_res/* android/app/src/main/res/

      - name: Khoá ký (nếu đã đặt trong Secrets)
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Chưa có khoá ký chính thức: dùng khoá thử (mỗi lần cài bản mới cần gỡ bản cũ)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/evoknx-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=evoknx-release.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          python3 - <<'PY'
          import os
          p = 'android/app/build.gradle.kts'
          if not os.path.exists(p):
              print('Không tìm thấy build.gradle.kts: bỏ qua ký chính thức.')
              raise SystemExit(0)
          s = open(p, encoding='utf-8').read()
          head = (
              'import java.util.Properties\n'
              'import java.io.FileInputStream\n\n'
              'val keystoreProperties = Properties()\n'
              'val keystorePropertiesFile = rootProject.file("key.properties")\n'
              'if (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n\n'
          )
          signing = (
              'android {\n'
              '    signingConfigs {\n'
              '        create("release") {\n'
              '            keyAlias = keystoreProperties["keyAlias"] as String\n'
              '            keyPassword = keystoreProperties["keyPassword"] as String\n'
              '            storeFile = file(keystoreProperties["storeFile"] as String)\n'
              '            storePassword = keystoreProperties["storePassword"] as String\n'
              '        }\n'
              '    }\n'
          )
          if 'signingConfigs.getByName("debug")' not in s:
              print('Mẫu cấu hình ký không khớp: bỏ qua ký chính thức.')
              raise SystemExit(0)
          s = head + s.replace('android {\n', signing, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w', encoding='utf-8').write(s)
          print('Đã bật ký chính thức.')
          PY

      - run: flutter pub get
      - name: Build APK
        # Chỉ chip arm64 (hầu hết điện thoại từ 2017): thư viện phát video khá nặng,
        # build đủ các chip sẽ làm file APK lên tới hàng trăm MB.
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64
      - name: Đặt tên file
        run: cp build/app/outputs/flutter-apk/app-release.apk evoknx.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EVOKNX-App-Android
          path: apps/evoknx_app/evoknx.apk
          retention-days: 30
