name: evoknx
description: EVOKNX – App điều khiển nhà thông minh KNX (Android, iOS).
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  evoknx_ui:
    path: ../../packages/evoknx_ui
  knx_core:
    path: ../../packages/knx_core
  knx_config:
    path: ../../packages/knx_config
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
