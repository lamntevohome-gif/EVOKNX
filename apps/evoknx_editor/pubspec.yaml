name: evoknx_editor
description: EvoKNX Editor - thiết kế giao diện điều khiển KNX cho Windows.
publish_to: none
version: 0.4.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  knx_core:
    path: ../../packages/knx_core
  knx_config:
    path: ../../packages/knx_config
  evoknx_ui:
    path: ../../packages/evoknx_ui
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
