name: evoknx_editor
description: EVOKNX Editor - thiết kế giao diện điều khiển KNX cho Windows.
publish_to: none
version: 0.4.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  knx_core:
    path: ../../packages/knx_core
  knx_config:
    path: ../../packages/knx_config
  file_selector: ^1.0.3
  flutter_svg: ^2.0.10
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/mdi/mdi_meta.json
  fonts:
    # Material Design Icons by Pictogrammers (Apache 2.0) – see assets/mdi/LICENSE.txt
    - family: MDI
      fonts:
        - asset: assets/mdi/materialdesignicons-webfont.ttf
